<html lang="en" xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">

<h3><f:translate key="LLL:EXT:form_to_database/Resources/Private/Language/locallang_be.xlf:index.existing_forms"/></h3>
<div class="table-fit">
	<table id="forms" class="table table-striped table-hover">
		<thead>
		<tr>
			<th class="col-icon">&nbsp;</th>
			<th class="col-title col-responsive">
				<f:render section="listHeaderSorting" arguments="{field: 'name', labelKey: 'LLL:EXT:form/Resources/Private/Language/Database.xlf:formManager.form_name', searchKey: searchKey, orderField: orderField, orderDirection: orderDirection}"/>
			</th>
			<th>
				<f:render section="listHeaderSorting" arguments="{field: 'maxCrDate', labelKey: 'LLL:EXT:form_to_database/Resources/Private/Language/locallang_be.xlf:index.latest', searchKey: searchKey, orderField: orderField, orderDirection: orderDirection}"/>
			</th>
			<th class="col-control">&nbsp;</th>
			<th>
				<f:render section="listHeaderSorting" arguments="{field: 'numberOfResults', labelKey: 'LLL:EXT:form_to_database/Resources/Private/Language/locallang_be.xlf:index.number_of_results', searchKey: searchKey, orderField: orderField, orderDirection: orderDirection}"/>
			</th>
			<f:if condition="!{extConf.hideLocationInList}">
				<th class="col-path">
					<f:render section="listHeaderSorting" arguments="{field: 'storageLocation', labelKey: 'LLL:EXT:form/Resources/Private/Language/Database.xlf:formManager.location', searchKey: searchKey, orderField: orderField, orderDirection: orderDirection}"/>
				</th>
			</f:if>
		</tr>
		</thead>
		<tbody>
		<f:for each="{forms}" as="form">
			<f:render partial="FormResults/Index/Results/Item" arguments="{_all}"/>
		</f:for>
		</tbody>
	</table>
</div>

<f:section name="listHeaderSorting">
	<div class="dropdown dropdown-static">
		<button class="dropdown-toggle dropdown-toggle-link" type="button" popovertarget="dropdown-menu-{field}">
			<f:translate key="{labelKey}"/>
			<f:if condition="{orderField} === {field}">
				<f:then>
					<div class="text-primary">
						<f:if condition="{orderDirection} === 'asc'">
							<f:then>
								<core:icon identifier="actions-sort-amount-up"/>
							</f:then>
							<f:else>
								<core:icon identifier="actions-sort-amount-down"/>
							</f:else>
						</f:if>
					</div>
				</f:then>
				<f:else>
					<div>
						<core:icon identifier="empty-empty"/>
					</div>
				</f:else>
			</f:if>
		</button>
		<ul class="dropdown-menu" id="dropdown-menu-{field}" popover="">
			<li>
				<a
						class="dropdown-item"
						href="{f:uri.action(action:'index', arguments:'{searchTerm: searchKey, orderField: field, orderDirection: \'asc\'}')}"
						title="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.sorting.asc')}"
				>
					{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.sorting.asc')}
				</a>
			</li>
			<li>
				<a
						class="dropdown-item"
						href="{f:uri.action(action:'index', arguments:'{searchTerm: searchKey, orderField: field, orderDirection: \'desc\'}')}"
						title="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.sorting.desc')}"
				>
					{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.sorting.desc')}
				</a>
			</li>
		</ul>
	</div>
</f:section>

</html>
